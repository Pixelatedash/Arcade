<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spaceship Shooter (Touch Ready)</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; color: white; font-family: Arial, sans-serif; }
    #gameCanvas { display: block; margin: 0 auto; background-color: #000; border: 2px solid #fff; touch-action: none; }
    #score, #highScore { position: absolute; top: 10px; left: 10px; font-size: 20px; color: #fff; }
    #highScore { top: 40px; }
    #gameOver { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; color: #fff; display: none; text-align: center; cursor: pointer; }
    .controls { position: absolute; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 100; }
    .dpad { display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; gap: 10px; }
    .button { width: 80px; height: 80px; background: rgba(255, 255, 255, 0.2); border: 3px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #fff; user-select: none; touch-action: none; }
    #fireButton { position: absolute; bottom: 40px; right: 40px; width: 100px; height: 100px; background: rgba(255, 0, 0, 0.4); border: 3px solid #fff; border-radius: 50%; font-size: 24px; display: flex; align-items: center; justify-content: center; user-select: none; touch-action: none; }
    #settingsButton { position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 255, 0.4); border: 3px solid #fff; border-radius: 50%; font-size: 24px; color: white; padding: 10px; user-select: none; touch-action: none; }
    #settingsPanel { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.7); padding: 20px; border: 2px solid #fff; display: none; color: #fff; z-index: 200; }
    #settingsPanel input { margin-bottom: 10px; }
    #difficultyButtons { position: absolute; top: 80px; left: 10px; display: flex; gap: 10px; z-index: 100; }
    .difficulty-btn { padding: 10px 20px; background: rgba(0, 0, 0, 0.5); border: 2px solid #fff; color: #fff; font-size: 16px; cursor: pointer; border-radius: 5px; }
    .difficulty-btn.active { background: rgba(255, 255, 255, 0.7); color: black; }
  </style>
</head>
<body>

<canvas id="gameCanvas" width="600" height="800"></canvas>
<div id="score">Score: 0</div>
<div id="highScore">High Score: 0</div>
<div id="gameOver">Game Over<br><small>Press R or tap to restart</small></div>

<div class="controls">
  <div class="dpad">
    <div class="row"><div class="button" id="upBtn">⬆️</div></div>
    <div class="row">
      <div class="button" id="leftBtn">⬅️</div>
      <div class="button" id="downBtn">⬇️</div>
      <div class="button" id="rightBtn">➡️</div>
    </div>
  </div>
</div>

<div id="fireButton">FIRE</div>
<div id="settingsButton">⚙️</div>

<div id="settingsPanel">
  <h3>Settings</h3>
  <label>Player Shape:</label>
  <select id="playerShape">
    <option value="triangle">Triangle</option>
    <option value="rectangle">Rectangle</option>
    <option value="circle">Circle</option>
    <option value="pentagon">Pentagon</option>
  </select><br>
  <label>Player Color:</label>
  <input type="color" id="playerColor" value="#FFFFFF"><br>
  <label>Enemy Shape:</label>
  <select id="enemyShape">
    <option value="square">Square</option>
    <option value="circle">Circle</option>
    <option value="hexagon">Hexagon</option>
    <option value="triangle">Triangle</option>
  </select><br>
  <label>Enemy Color:</label>
    <input type="color" id="enemyColor" value="#FF0000"><br>
  <button onclick="saveSettings()">Save</button>
  <button onclick="closeSettings()">Close</button>
</div>

<div id="difficultyButtons">
  <button class="difficulty-btn" id="easyBtn">Easy</button>
  <button class="difficulty-btn" id="mediumBtn">Medium</button>
  <button class="difficulty-btn" id="hardBtn">Hard</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let spaceship = { x: canvas.width / 2 - 20, y: canvas.height - 60, width: 40, height: 40, speed: 5, color: '#FFFFFF', shape: 'triangle' };
let lasers = [], enemies = [], explosions = [], powerUps = [], keys = {};
let score = 0, highScore = localStorage.getItem('highScore') || 0;
let gameRunning = true, shootCooldown = 0;
let enemySettings = { shape: 'square', color: '#FF0000' };
let spawnCooldown = 60;
let spawnRate = 60;
let difficulty = 'medium';
let buddy = null; // Small buddy for yellow power-up
let tripleShooterActive = false; // Triple shooter for purple power-up
let tripleShooterTimer = 0; // Timer for triple shooter

document.getElementById('highScore').innerText = 'High Score: ' + highScore;

// Difficulty Setup
const difficulties = {
  easy: { spawnRate: 80, enemySpeedMin: 1, enemySpeedMax: 2, playerSpeed: 6 },
  medium: { spawnRate: 60, enemySpeedMin: 2, enemySpeedMax: 4, playerSpeed: 5 },
  hard: { spawnRate: 30, enemySpeedMin: 2, enemySpeedMax: 8, playerSpeed: 4 }
};

function setDifficulty(level) {
  difficulty = level;
  spawnRate = difficulties[level].spawnRate;
  spaceship.speed = difficulties[level].playerSpeed;
  
  document.querySelectorAll('.difficulty-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById(level + 'Btn').classList.add('active');
}

document.getElementById('easyBtn').onclick = () => setDifficulty('easy');
document.getElementById('mediumBtn').onclick = () => setDifficulty('medium');
document.getElementById('hardBtn').onclick = () => setDifficulty('hard');

setDifficulty('medium'); // Default

// Input and Buttons
document.addEventListener('keydown', e => { keys[e.code] = true; if (!gameRunning && e.code === 'KeyR') restartGame(); });
document.addEventListener('keyup', e => { keys[e.code] = false; });

let touchControls = { ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false, Space: false };

function setKey(key, isPressed) {
  keys[key] = isPressed;
  touchControls[key] = isPressed;
}

['leftBtn', 'rightBtn', 'upBtn', 'downBtn', 'fireButton'].forEach((id, idx) => {
  let keyMap = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'][idx];
  let btn = document.getElementById(id);
  btn.addEventListener('touchstart', e => { e.preventDefault(); setKey(keyMap, true); });
  btn.addEventListener('touchend', e => { e.preventDefault(); setKey(keyMap, false); });
});

document.getElementById('gameOver').addEventListener('click', restartGame);
document.getElementById('settingsButton').addEventListener('click', () => {
  document.getElementById('settingsPanel').style.display = 'block';
});
function closeSettings() {
  document.getElementById('settingsPanel').style.display = 'none';
}
function saveSettings() {
  spaceship.shape = document.getElementById('playerShape').value;
  spaceship.color = document.getElementById('playerColor').value;
  enemySettings.shape = document.getElementById('enemyShape').value;
  enemySettings.color = document.getElementById('enemyColor').value;
  closeSettings();
}

// Drawing Functions
function drawSpaceship() {
  ctx.fillStyle = spaceship.color;
  ctx.beginPath();
  const { x, y, width, height } = spaceship;

  switch (spaceship.shape) {
    case 'triangle':
      ctx.moveTo(x + width / 2, y);
      ctx.lineTo(x, y + height);
      ctx.lineTo(x + width, y + height);
      break;
    case 'rectangle':
      ctx.rect(x, y, width, height);
      break;
    case 'circle':
      ctx.arc(x + width / 2, y + height / 2, width / 2, 0, Math.PI * 2);
      break;
    case 'pentagon':
      const pAngle = Math.PI * 2 / 5;
      for (let i = 0; i < 5; i++) {
        const px = x + width / 2 + Math.cos(pAngle * i - Math.PI / 2) * width / 2;
        const py = y + height / 2 + Math.sin(pAngle * i - Math.PI / 2) * height / 2;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      break;
  }

  ctx.closePath();
  ctx.fill();
}

function drawLaser(laser) {
  ctx.fillStyle = 'lime';
  ctx.fillRect(laser.x, laser.y, laser.width, laser.height);
}

function drawEnemy(enemy) {
  ctx.fillStyle = enemy.color;
  const { x, y, width, height, shape } = enemy;

  ctx.beginPath();
  switch (shape) {
    case 'square':
      ctx.fillRect(x, y, width, height);
      return;
    case 'circle':
      ctx.arc(x + width / 2, y + height / 2, width / 2, 0, Math.PI * 2);
      break;
    case 'hexagon':
      const hAngle = Math.PI / 3;
      for (let i = 0; i < 6; i++) {
        const hx = x + width / 2 + Math.cos(hAngle * i) * width / 2;
        const hy = y + height / 2 + Math.sin(hAngle * i) * height / 2;
        if (i === 0) ctx.moveTo(hx, hy);
        else ctx.lineTo(hx, hy);
      }
      break;
    case 'triangle':
      ctx.moveTo(x + width / 2, y);
      ctx.lineTo(x, y + height);
      ctx.lineTo(x + width, y + height);
      break;
  }
  ctx.closePath();
  ctx.fill();
}

function spawnEnemy() {
  let size = 40;
  let x = Math.random() * (canvas.width - size);
  let speed = Math.random() * (difficulties[difficulty].enemySpeedMax - difficulties[difficulty].enemySpeedMin) + difficulties[difficulty].enemySpeedMin;
  let type = Math.random() < 0.1 ? 'zigzag' : 'normal'; // 10% chance for zigzag enemies
  enemies.push({ x, y: -size, width: size, height: size, speed, color: enemySettings.color, shape: enemySettings.shape, type, angle: 0 });
}

function spawnPowerUp() {
  if (Math.random() < 0.01) { // 1% chance to spawn a power-up
    let type = Math.random() < 0.5 ? 'yellow' : 'purple'; // 50% chance for yellow or purple
    powerUps.push({ x: Math.random() * (canvas.width - 20), y: -20, width: 20, height: 20, type });
  }
}

function createExplosion(x, y) {
  explosions.push({ x, y, radius: 0, maxRadius: 20, alpha: 1 });
}

function drawExplosion(explosion) {
  ctx.beginPath();
  ctx.arc(explosion.x, explosion.y, explosion.radius, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(255, 165, 0, ${explosion.alpha})`;
  ctx.fill();
  ctx.closePath();
}

function drawPowerUp(powerUp) {
  ctx.fillStyle = powerUp.type === 'yellow' ? 'yellow' : 'purple';
  ctx.beginPath();
  ctx.arc(powerUp.x + powerUp.width / 2, powerUp.y + powerUp.height / 2, powerUp.width / 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.closePath();
}

function restartGame() {
  gameRunning = true;
  enemies = [];
  lasers = [];
  explosions = [];
  powerUps = [];
  buddy = null;
  tripleShooterActive = false;
  tripleShooterTimer = 0;
  score = 0;
  spaceship.x = canvas.width / 2 - spaceship.width / 2;
  document.getElementById('gameOver').style.display = 'none';
  loop();
}

function loop() {
  if (!gameRunning) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Movement
  if (keys['ArrowLeft'] && spaceship.x > 0) spaceship.x -= spaceship.speed;
  if (keys['ArrowRight'] && spaceship.x < canvas.width - spaceship.width) spaceship.x += spaceship.speed;
  if (keys['ArrowUp'] && spaceship.y > 0) spaceship.y -= spaceship.speed;
  if (keys['ArrowDown'] && spaceship.y < canvas.height - spaceship.height) spaceship.y += spaceship.speed;

  // Shooting
  if (shootCooldown > 0) shootCooldown--;
  if (keys['Space'] && shootCooldown === 0) {
    if (tripleShooterActive) {
      lasers.push({ x: spaceship.x + spaceship.width / 2 - 10, y: spaceship.y, width: 4, height: 20 });
      lasers.push({ x: spaceship.x + spaceship.width / 2 - 2, y: spaceship.y, width: 4, height: 20 });
      lasers.push({ x: spaceship.x + spaceship.width / 2 + 6, y: spaceship.y, width: 4, height: 20 });
    } else {
      lasers.push({ x: spaceship.x + spaceship.width / 2 - 2, y: spaceship.y, width: 4, height: 20 });
    }
    shootCooldown = 15;
  }

  // Buddy Shooting
  if (buddy && shootCooldown === 0) {
    lasers.push({ x: buddy.x + buddy.width / 2 - 2, y: buddy.y, width: 4, height: 20 });
  }

  // Lasers
  lasers.forEach(laser => laser.y -= 10);
  lasers = lasers.filter(laser => laser.y + laser.height > 0);

  // Enemies
  if (--spawnCooldown <= 0) {
    spawnEnemy();
    spawnPowerUp();
    spawnCooldown = spawnRate;
  }
  enemies.forEach(enemy => {
    if (enemy.type === 'zigzag') {
      enemy.angle += 0.05;
      enemy.x += Math.sin(enemy.angle) * 2;
    }
    enemy.y += enemy.speed;
  });
  enemies = enemies.filter(enemy => enemy.y < canvas.height);

  // Power-Ups
  powerUps.forEach((powerUp, i) => {
    powerUp.y += 2;
    if (powerUp.y > canvas.height) {
      powerUps.splice(i, 1);
    } else if (powerUp.x < spaceship.x + spaceship.width && powerUp.x + powerUp.width > spaceship.x &&
               powerUp.y < spaceship.y + spaceship.height && powerUp.y + powerUp.height > spaceship.y) {
      if (powerUp.type === 'yellow') {
        buddy = { x: spaceship.x - 30, y: spaceship.y, width: 20, height: 20 };
      } else if (powerUp.type === 'purple') {
        tripleShooterActive = true;
        tripleShooterTimer = 300; // 5 seconds at 60 FPS
      }
      powerUps.splice(i, 1);
    }
  });

  // Triple Shooter Timer
  if (tripleShooterActive) {
    tripleShooterTimer--;
    if (tripleShooterTimer <= 0) {
      tripleShooterActive = false;
    }
  }

  // Buddy Movement
  if (buddy) {
    buddy.x = spaceship.x - 30;
    buddy.y = spaceship.y;
  }

  // Collisions
  enemies.forEach((enemy, i) => {
    lasers.forEach((laser, j) => {
      if (laser.x < enemy.x + enemy.width && laser.x + laser.width > enemy.x &&
          laser.y < enemy.y + enemy.height && laser.y + laser.height > enemy.y) {
        enemies.splice(i, 1);
        lasers.splice(j, 1);
        score++;
        document.getElementById('score').innerText = 'Score: ' + score;
        createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2); // Create explosion
      }
    });

    if (spaceship.x < enemy.x + enemy.width && spaceship.x + spaceship.width > enemy.x &&
        spaceship.y < enemy.y + enemy.height && spaceship.y + spaceship.height > enemy.y) {
      gameRunning = false;
      document.getElementById('gameOver').style.display = 'block';
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('highScore', highScore);
        document.getElementById('highScore').innerText = 'High Score: ' + highScore;
      }
    }
  });

  // Explosions
  explosions.forEach((explosion, i) => {
    explosion.radius += 1;
    explosion.alpha -= 0.05;
    if (explosion.alpha <= 0) {
      explosions.splice(i, 1);
    }
  });

  drawSpaceship();
  if (buddy) {
    ctx.fillStyle = 'yellow';
    ctx.fillRect(buddy.x, buddy.y, buddy.width, buddy.height);
  }
  lasers.forEach(drawLaser);
  enemies.forEach(drawEnemy);
  powerUps.forEach(drawPowerUp);
  explosions.forEach(drawExplosion);

  if (gameRunning) requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
